<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repository Stats · monkey-sking</title>
<style>
  :root{
    --bg:#ffffff; --fg:#1f2328; --muted:#656d76; --line:#d0d7de; --card:#f6f8fa;
    --accent:#0969da; --accent2:#1a7f37; --accent3:#8250df; --warn:#bc4c00;
    --shadow:0 1px 3px rgba(27,31,36,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0d1117; --fg:#e6edf3; --muted:#8b949e; --line:#30363d; --card:#161b22;
      --accent:#58a6ff; --accent2:#3fb950; --accent3:#a371f7; --warn:#db6d28;
      --shadow:0 1px 3px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:32px 20px 64px; background:var(--bg); color:var(--fg);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans SC",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:13px;margin-bottom:24px}
  .sub code{background:var(--card);padding:1px 5px;border-radius:4px;font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin-bottom:28px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
  .kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
  .kpi .l{color:var(--muted);font-size:12px;margin-top:2px}
  .kpi .n{color:var(--muted);font-size:11px;margin-top:4px}
  section{margin-bottom:32px}
  h2{font-size:15px;margin:0 0 12px;font-weight:600}
  h2 .hint{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;box-shadow:var(--shadow)}
  .charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
  .chart-t{font-size:12px;color:var(--muted);margin-bottom:8px;display:flex;justify-content:space-between}
  .chart-t b{color:var(--fg);font-size:13px}
  svg{display:block;width:100%;height:auto;overflow:visible}
  .grid line{stroke:var(--line);stroke-width:1;stroke-dasharray:2 3}
  .axis text{fill:var(--muted);font-size:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  thead th{
    text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);
    color:var(--muted);font-weight:500;font-size:11.5px;text-transform:uppercase;
    letter-spacing:.04em;cursor:pointer;white-space:nowrap;user-select:none;
  }
  thead th:hover{color:var(--fg)}
  thead th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
  tbody td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:var(--card)}
  tbody tr.sel{background:var(--card);box-shadow:inset 3px 0 0 var(--accent)}
  tbody tr:last-child td{border-bottom:0}
  .rname{font-weight:500;color:var(--accent);text-decoration:none}
  .rname:hover{text-decoration:underline}
  .lang{color:var(--muted);font-size:11.5px;display:flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:0 0 auto}
  .zero{color:var(--muted);opacity:.5}
  .spark{width:64px;height:18px;display:block}
  .detail{margin-top:16px;display:none}
  .detail.on{display:block}
  .detail h3{font-size:14px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .detail h3 a{color:var(--accent);text-decoration:none;font-weight:600}
  .detail h3 a:hover{text-decoration:underline}
  .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
  .cols h4{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px;font-weight:500}
  .bar-row{display:grid;grid-template-columns:1fr 44px;gap:8px;align-items:center;font-size:12px;margin-bottom:5px}
  .bar-track{background:var(--line);height:6px;border-radius:3px;overflow:hidden}
  .bar-fill{background:var(--accent);height:100%;border-radius:3px}
  .bar-lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11.5px}
  .bar-val{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:11.5px}
  .muted{color:var(--muted)}
  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
  .empty{padding:24px;text-align:center;color:var(--muted);font-size:13px}
  .err{background:var(--warn);color:#fff;padding:10px 14px;border-radius:6px;font-size:13px;margin-bottom:16px;display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Repository Stats</h1>
  <div class="sub" id="sub">加载中…</div>
  <div class="err" id="err"></div>

  <div class="kpis" id="kpis"></div>

  <section>
    <h2>趋势 <span class="hint" id="trend-hint"></span></h2>
    <div class="charts">
      <div class="panel">
        <div class="chart-t"><b>每日浏览 / 独立访客</b><span id="c1-sum"></span></div>
        <div id="chart-views"></div>
      </div>
      <div class="panel">
        <div class="chart-t"><b>每日克隆</b><span id="c2-sum"></span></div>
        <div id="chart-clones"></div>
      </div>
      <div class="panel">
        <div class="chart-t"><b>Star 总数</b><span id="c3-sum"></span></div>
        <div id="chart-stars"></div>
      </div>
      <div class="panel">
        <div class="chart-t"><b>每周提交</b><span>近 26 周</span></div>
        <div id="chart-commits"></div>
      </div>
    </div>
  </section>

  <section>
    <h2>仓库明细 <span class="hint">点击行展开来源与热门页面</span></h2>
    <div class="panel" style="padding:4px 8px">
      <table>
        <thead>
          <tr>
            <th data-k="name">仓库</th>
            <th data-k="language">语言</th>
            <th data-k="license">许可证</th>
            <th data-k="stars" class="num">Stars</th>
            <th data-k="forks" class="num">Forks</th>
            <th data-k="views" class="num">浏览<small>14d</small></th>
            <th data-k="uniques" class="num">访客<small>14d</small></th>
            <th data-k="clones" class="num">克隆<small>14d</small></th>
            <th data-k="contributors" class="num">贡献者</th>
            <th data-k="pushed_at">最近推送</th>
            <th>浏览趋势</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">暂无数据</div>
    </div>
    <div class="panel detail" id="detail"></div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
"use strict";

/* ------------------------------------------------------------------ helpers */
const $ = (s, r = document) => r.querySelector(s);
const fmt = n => (n === null || n === undefined) ? "—" : new Intl.NumberFormat("en-US").format(n);
const fmtAbs = n => n >= 1000 ? (n / 1000).toFixed(n >= 10000 ? 0 : 1) + "k" : String(n ?? 0);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const daysAgo = iso => {
  if (!iso) return "—";
  const d = Math.floor((Date.now() - new Date(iso).getTime()) / 864e5);
  if (d <= 0) return "今天";
  if (d === 1) return "昨天";
  if (d < 30) return d + " 天前";
  if (d < 365) return Math.floor(d / 30) + " 个月前";
  return Math.floor(d / 365) + " 年前";
};
const LANG_COLORS = {
  JavaScript:"#f1e05a", TypeScript:"#3178c6", Python:"#3572A5", Swift:"#F05138",
  HTML:"#e34c26", Shell:"#89e051", PowerShell:"#012456", Go:"#00ADD8",
  Rust:"#dea584", C:"#555555", "C++":"#f34b7d", Java:"#b07219", Kotlin:"#A97BFF",
  CSS:"#563d7c", Ruby:"#701516", Dart:"#00B4AB", Vue:"#41b883", MDX:"#fcb32c"
};

/* --------------------------------------------------------------- sparklines */
function sparkline(values, w = 64, h = 18, color = "var(--accent)") {
  if (!values || values.length < 1) return "";
  const max = Math.max(1, ...values);
  const n = values.length;
  const step = n > 1 ? w / (n - 1) : w;
  const pts = values.map((v, i) => [n > 1 ? i * step : w / 2, h - 2 - (v / max) * (h - 4)]);
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = d + ` L${pts[pts.length-1][0].toFixed(1)} ${h} L${pts[0][0].toFixed(1)} ${h} Z`;
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${area}" fill="${color}" opacity=".12"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
  </svg>`;
}

/* ------------------------------------------------------------------ charts */
function lineChart(el, series, opts = {}) {
  const { w = 520, h = 170, pad = { t: 12, r: 10, b: 22, l: 38 } } = opts;
  if (!series.length || !series[0].values.length) {
    el.innerHTML = '<div class="empty">暂无历史数据 — 需要至少运行两次采集才能画出趋势</div>';
    return;
  }
  const labels = series[0].labels;
  const all = series.flatMap(s => s.values);
  const max = Math.max(1, ...all);
  const niceMax = max <= 5 ? 5 : Math.ceil(max / Math.pow(10, Math.floor(Math.log10(max)))) * Math.pow(10, Math.floor(Math.log10(max)));
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const n = labels.length;
  const X = i => n > 1 ? pad.l + (i / (n - 1)) * iw : pad.l + iw / 2;
  const Y = v => pad.t + ih - (v / niceMax) * ih;

  let grid = "", yticks = "";
  for (let k = 0; k <= 4; k++) {
    const v = (niceMax / 4) * k, y = Y(v);
    grid += `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w - pad.r}" y2="${y.toFixed(1)}"/>`;
    yticks += `<text x="${pad.l - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end">${fmtAbs(Math.round(v))}</text>`;
  }
  let xt = "";
  const stepL = Math.max(1, Math.ceil(n / 5));
  for (let i = 0; i < n; i += stepL) {
    xt += `<text x="${X(i).toFixed(1)}" y="${h - 6}" text-anchor="middle">${labels[i].slice(5)}</text>`;
  }

  let paths = "";
  for (const s of series) {
    const d = s.values.map((v, i) => `${i ? "L" : "M"}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).join(" ");
    if (s.fill) {
      paths += `<path d="${d} L${X(n - 1).toFixed(1)} ${Y(0)} L${X(0).toFixed(1)} ${Y(0)} Z" fill="${s.color}" opacity=".10"/>`;
    }
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/>`;
    if (n <= 40) {
      paths += s.values.map((v, i) =>
        `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.2" fill="${s.color}"/>`).join("");
    }
  }
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img">
    <g class="grid">${grid}</g>
    <g class="axis">${yticks}${xt}</g>
    ${paths}
  </svg>
  <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px">
    ${series.map(s => `<span style="display:flex;align-items:center;gap:5px">
      <span style="width:9px;height:2.5px;background:${s.color};display:inline-block;border-radius:2px"></span>${esc(s.name)}</span>`).join("")}
  </div>`;
}

function barChart(el, labels, values, color = "var(--accent2)") {
  if (!values.length) { el.innerHTML = '<div class="empty">暂无数据</div>'; return; }
  const w = 520, h = 170, pad = { t: 12, r: 10, b: 22, l: 38 };
  const max = Math.max(1, ...values);
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const bw = iw / values.length;
  let bars = "", xt = "";
  values.forEach((v, i) => {
    const bh = (v / max) * ih;
    const x = pad.l + i * bw + bw * 0.12, y = pad.t + ih - bh;
    bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${(bw * 0.76).toFixed(1)}" height="${Math.max(0, bh).toFixed(1)}" fill="${color}" rx="2" opacity="${v ? .85 : .18}"/>`;
    if (i % Math.max(1, Math.ceil(values.length / 5)) === 0) {
      xt += `<text x="${(pad.l + i * bw + bw / 2).toFixed(1)}" y="${h - 6}" text-anchor="middle">${esc(labels[i])}</text>`;
    }
  });
  let grid = "", yt = "";
  for (let k = 0; k <= 4; k++) {
    const v = (max / 4) * k, y = pad.t + ih - (v / max) * ih;
    grid += `<line x1="${pad.l}" y1="${y.toFixed(1)}" x2="${w - pad.r}" y2="${y.toFixed(1)}"/>`;
    yt += `<text x="${pad.l - 6}" y="${(y + 3).toFixed(1)}" text-anchor="end">${fmtAbs(Math.round(v))}</text>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img">
    <g class="grid">${grid}</g><g class="axis">${yt}${xt}</g>${bars}</svg>`;
}

/* ------------------------------------------------------------------- state */
let SNAP = [];          // array of {day, data} ascending
let ROWS = [];          // flattened latest rows
let sortKey = "views", sortDir = -1, selected = null;
let LAST = {}, DAYS = [];

/* -------------------------------------------------------------------- boot */
async function boot() {
  try {
    const idx = await (await fetch("./data/index.json", { cache: "no-cache" })).json();
    const days = idx.days || [];
    const loads = await Promise.all(days.map(async d => {
      try {
        const r = await fetch(`./data/daily/${d}.json`, { cache: "no-cache" });
        return r.ok ? { day: d, data: await r.json() } : null;
      } catch { return null; }
    }));
    SNAP = loads.filter(Boolean).sort((a, b) => a.day < b.day ? -1 : 1);
    DAYS = SNAP.map(s => s.day);
    if (!SNAP.length) throw new Error("没有找到任何快照文件");

    LAST = SNAP[SNAP.length - 1].data;
    const gen = LAST.generated_at || idx.generated_at;
    const repoCount = Object.keys(LAST.repos || {}).length;
    $("#sub").innerHTML = `账号 <code>${esc(idx.owner)}</code> · ${repoCount} 个公开仓库 · 更新于 ${esc(new Date(gen).toLocaleString("zh-CN"))} · <code>docs/data/daily/</code> 共 ${DAYS.length} 份快照`;
    $("#foot").innerHTML = `数据来自 GitHub REST API（仓库元数据 + <code>traffic/*</code>）。流量接口只有 14 天滚动窗口，所以每天落一份快照把历史留下来。生成时间 ${esc(gen)}。`;

    buildRows();
    renderKpis();
    renderCharts();
    renderTable();
  } catch (e) {
    $("#err").style.display = "block";
    $("#err").textContent = "加载失败：" + e.message;
    $("#sub").textContent = "";
  }
}

function buildRows() {
  ROWS = Object.entries(LAST.repos || {}).map(([name, r]) => {
    const v = r.views || {}, c = r.clones || {};
    return {
      name, ...r,
      views: v.total ?? 0, uniques: v.uniques ?? 0, clones: c.total ?? 0,
      clone_uniques: c.uniques ?? 0,
      viewSeries: Object.keys(v.daily || {}).sort().map(k => v.daily[k].count),
      cloneSeries: Object.keys(c.daily || {}).sort().map(k => c.daily[k].count),
    };
  });
}

function renderKpis() {
  const total = k => ROWS.reduce((a, r) => a + (r[k] || 0), 0);
  const stars = total("stars"), forks = total("forks");
  const views = total("views"), uniques = total("uniques"), clones = total("clones");
  const commits = ROWS.reduce((a, r) => a + (r.weekly_commits || []).slice(-12).reduce((x, y) => x + y, 0), 0);
  const active = ROWS.filter(r => r.views > 0).length;
  const kpi = (v, l, n = "") => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div>${n ? `<div class="n">${n}</div>` : ""}</div>`;
  $("#kpis").innerHTML =
    kpi(fmt(stars), "Stars 合计", `${ROWS.filter(r => r.stars > 0).length} 个仓库有 star`) +
    kpi(fmt(views), "浏览（14 天）", `${uniques} 位独立访客`) +
    kpi(fmt(clones), "克隆（14 天）", `${active} 个仓库有流量`) +
    kpi(fmt(commits), "近 12 周提交", `${ROWS.length} 个公开仓库`) +
    kpi(fmt(forks), "Forks 合计", stars ? `star/fork ≈ ${(stars / Math.max(1, forks)).toFixed(1)}` : "");
}

function renderCharts() {
  $("#trend-hint").textContent = DAYS.length < 2
    ? `只有 1 天快照 — 趋势图会在第二次采集后出现`
    : `${DAYS.length} 天历史`;

  // Daily views/uniques summed across repos, from traffic daily buckets merged
  // over every snapshot (later snapshots win for overlapping days).
  const viewByDay = {}, uniqByDay = {};
  for (const s of SNAP) {
    for (const r of Object.values(s.data.repos || {})) {
      for (const [d, x] of Object.entries((r.views || {}).daily || {})) {
        viewByDay[d] = x.count; uniqByDay[d] = x.uniques;
      }
    }
  }
  const trafficDays = Object.keys(viewByDay).sort();
  lineChart($("#chart-views"), [
    { name: "浏览", color: "var(--accent)", labels: trafficDays, values: trafficDays.map(d => viewByDay[d]), fill: true },
    { name: "独立访客", color: "var(--accent3)", labels: trafficDays, values: trafficDays.map(d => uniqByDay[d]) },
  ]);
  const tv = trafficDays.reduce((a, d) => a + viewByDay[d], 0);
  $("#c1-sum").textContent = tv ? `14 天 ${fmt(tv)}` : "";

  const cloneByDay = {};
  for (const s of SNAP) {
    for (const r of Object.values(s.data.repos || {})) {
      for (const [d, x] of Object.entries((r.clones || {}).daily || {})) cloneByDay[d] = x.count;
    }
  }
  const cDays = Object.keys(cloneByDay).sort();
  lineChart($("#chart-clones"), [
    { name: "克隆", color: "var(--accent2)", labels: cDays, values: cDays.map(d => cloneByDay[d]), fill: true },
  ]);
  const tc = cDays.reduce((a, d) => a + cloneByDay[d], 0);
  $("#c2-sum").textContent = tc ? `14 天 ${fmt(tc)}` : "";

  // Star total across snapshots (only meaningful once >1 day exists).
  const starSeries = SNAP.map(s => Object.values(s.data.repos || {}).reduce((a, r) => a + (r.stars || 0), 0));
  lineChart($("#chart-stars"), [
    { name: "Stars", color: "#d29922", labels: DAYS, values: starSeries, fill: true },
  ]);
  $("#c3-sum").textContent = starSeries.length ? fmt(starSeries[starSeries.length - 1]) + " ★" : "";

  // Weekly commits aggregated over the last 26 weeks.
  const W = 26;
  const total = new Array(W).fill(0);
  let any = false;
  for (const r of ROWS) {
    const w = (r.weekly_commits || []).slice(-W);
    if (!w.length) continue;
    any = true;
    const off = W - w.length;
    w.forEach((v, i) => { total[off + i] += v; });
  }
  const wLabels = total.map((_, i) => `-${W - 1 - i}w`);
  barChart($("#chart-commits"), wLabels, any ? total : []);
}

function renderTable() {
  const rows = [...ROWS].sort((a, b) => {
    const A = a[sortKey], B = b[sortKey];
    if (typeof A === "string" || typeof B === "string") {
      return String(A ?? "").localeCompare(String(B ?? "")) * sortDir;
    }
    return ((A ?? 0) - (B ?? 0)) * sortDir;
  });
  const num = v => v ? fmt(v) : '<span class="zero">0</span>';
  $("#rows").innerHTML = rows.map(r => `
    <tr data-n="${esc(r.name)}" class="${selected === r.name ? "sel" : ""}">
      <td><a class="rname" href="https://github.com/monkey-sking/${esc(r.name)}" target="_blank" rel="noopener"
             onclick="event.stopPropagation()">${esc(r.name)}</a></td>
      <td><span class="lang"><span class="dot" style="background:${LANG_COLORS[r.language] || "var(--muted)"}"></span>${esc(r.language || "—")}</span></td>
      <td class="muted">${esc(r.license || "—")}</td>
      <td class="num">${num(r.stars)}</td>
      <td class="num">${num(r.forks)}</td>
      <td class="num">${num(r.views)}</td>
      <td class="num">${num(r.uniques)}</td>
      <td class="num">${num(r.clones)}</td>
      <td class="num">${r.contributors ? fmt(r.contributors) : '<span class="zero">—</span>'}</td>
      <td class="muted">${esc(daysAgo(r.pushed_at))}</td>
      <td>${r.viewSeries.length ? sparkline(r.viewSeries) : '<span class="zero">—</span>'}</td>
    </tr>`).join("");

  document.querySelectorAll("#rows tr").forEach(tr => {
    tr.addEventListener("click", () => selectRepo(tr.dataset.n));
  });
  document.querySelectorAll("thead th[data-k]").forEach(th => {
    const k = th.dataset.k;
    if (k === sortKey) th.textContent = th.textContent.replace(/[ ▲▼]+$/, "") + (sortDir > 0 ? " ▲" : " ▼");
    th.onclick = () => {
      if (sortKey === k) sortDir *= -1; else { sortKey = k; sortDir = -1; }
      renderTable();
    };
  });
}

function barList(title, items, keyName, valName) {
  if (!items || !items.length) return `<div><h4>${esc(title)}</h4><div class="muted" style="font-size:12px">无数据</div></div>`;
  const max = Math.max(1, ...items.map(x => x[valName] || 0));
  return `<div><h4>${esc(title)}</h4>${items.map(x => `
    <div class="bar-row">
      <div>
        <div class="bar-lab" title="${esc(x[keyName])}">${esc(x[keyName])}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${((x[valName] || 0) / max * 100).toFixed(1)}%"></div></div>
      </div>
      <div class="bar-val">${fmt(x[valName] || 0)}</div>
    </div>`).join("")}</div>`;
}

function selectRepo(name) {
  if (selected === name) { selected = null; $("#detail").classList.remove("on"); renderTable(); return; }
  selected = name;
  const r = ROWS.find(x => x.name === name);
  if (!r) return;
  const v = r.views || {}, c = r.clones || {};
  const vd = Object.keys(v.daily || {}).sort();
  $("#detail").innerHTML = `
    <h3><a href="https://github.com/monkey-sking/${esc(name)}" target="_blank" rel="noopener">${esc(name)}</a>
      <span class="muted" style="font-weight:400;font-size:12px">
        ${esc(r.language || "—")} · ${esc(r.license || "—")} · ${fmt(r.stars)}★ · ${fmt(r.forks)} forks · 创建于 ${esc((r.created_at || "").slice(0, 10))}
      </span></h3>
    ${r.description ? `<div class="muted" style="margin-bottom:14px;font-size:13px">${esc(r.description)}</div>` : ""}
    <div class="cols">
      <div>
        <h4>浏览趋势（14 天）</h4>
        ${vd.length ? `<div style="margin-bottom:6px">${sparkline(vd.map(d => v.daily[d].count), 260, 46, "var(--accent)")}</div>
        <div class="muted" style="font-size:12px">${fmt(v.total)} 次浏览 · ${fmt(v.uniques)} 位独立访客 · 峰值 ${fmt(Math.max(...vd.map(d => v.daily[d].count)))}/天</div>`
        : '<div class="muted" style="font-size:12px">无流量数据</div>'}
      </div>
      ${barList("来源（referrers）", r.referrers, "ref", "uniques")}
      ${barList("热门页面", r.paths, "path", "uniques")}
      <div>
        <h4>克隆</h4>
        <div class="muted" style="font-size:12px">${fmt(c.total)} 次克隆 · ${fmt(c.uniques)} 个独立来源</div>
      </div>
    </div>`;
  $("#detail").classList.add("on");
  renderTable();
}

boot();
</script>
</body>
</html>
